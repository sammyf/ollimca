<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollimca (OLLama IMage CAtegoriser)</title>
    <script src="https://unpkg.com/htmx.org@1.9.5"></script>
    <style>
        #progress {
            background: #111111;
            color: #dddddd;
            font-weight: bold;
            font-size: small;
            margin-top: 20px;
            padding: 10px;
            border: 1px inset #ccc;
            min-height: 50px;
        }

        #controls {
            background: #555555;
            color: #dddddd;
            font-weight: bold;
            font-size: small;
            margin-top: 20px;
            padding: 10px;
            min-height: 50px;
            text-align: center;
            width: 100%;
        }

        html {
            background-color: #6c6b6b;
            color: #cccccc;
        }

        input    {
            background-color: #4ba585;
            color: white;
            font-family: bolder;
            font-size: large;
            margin-top: 5px;
            margin-bottom: 5px;
            border: 1px inset #ccc;
        }
        button {
            background-color: #001c00;
            color: white;
            max-width: 250px;
            min-width: 250px;
        }
        hr {
            border: 1px solid #cccccc;
        }
        .button-container {
            display: flex;
            gap: 10px; /* Optional: Adds space between buttons */
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Ensure buttons take full width when stacked */
        .button-container button {
            flex-basis: calc(50% - 10px); /* Adjusts for the gap */
        }

        @media (max-width: 600px) {
            .button-container button {
                flex-basis: 100%; /* Stacks buttons vertically on smaller screens */
            }
        }
        #categorize-box {
            border: 1px solid #cccccc;
            background-color: #535353;
            padding: 10px;
        }
        #spinner {
            width:100%;
            height:6px;
        }
    </style>
</head>
<body>

<h3 id="title">Ollama IMage CAtegoriser<br>version <span id="title_version"></span></h3>
<div id="controls">
    <form id="form" action="/api/categorize">
        <label for="dPath">Absolute path of the directory to crawl through:</label><br>
        <input type="text" id="dPath" name="dPath" value=""><br>
        <hr>
        <div class="button-container">
            <div id="categorize-box">
                <label for="complex">Use multiple queries instead of one. Much slower, but better results!</label>
                <input type="checkbox" id="complex" name="complex"><br>
                <button hx-post="/api/categorize" hx-trigger="click" hx-swap="beforeend" hx-target="#progress" id="sendbutton1" hx-indicator="#spinner" autofocus>Look for images and categorize them</button>
            </div>
            <button hx-post="/api/facerec" hx-trigger="click" hx-swap="beforeend" hx-target="#progress" id="sendbutton2" hx-indicator="#spinner">Try to identify faces in the images<br>(experimental and needs a GPU!)</button>
        </div>
    </form>
</div>
<img id="spinner" class="htmx-indicator" src="loader.gif">
<div id="progress"></div>
<div hx-get="/api/version" hx-trigger="load" hx-target="#title_version"></div>

<script language="JavaScript" type="text/javascript">
            // Function to fetch data from the API and update the progress div
    function updateProgress() {
        fetch('/api/status')
            .then(response => response.text())
            .then(data => {
                document.getElementById('progress').innerText = data;
            })
            .catch(error => {
                console.error('Error fetching status:', error);
                document.getElementById('progress').innerText = 'Error loading status';
            });
    }

    // Set up a timer to call updateProgress every 5 seconds
    //document.getElementById('sendbutton').addEventListener('htmx:afterOnLoad', function() {
        setInterval(updateProgress, 30000);
    //});
</script>
</body>
</html>
